<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project allocation</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<main>
    <h1>Project allocation</h1>
    <p class="intro">Partner project with Ayan Muday for CO3105. Change the choices, then allocate. The page runs the same steps as the C++ program.</p>
    <div class="actions">
        <button id="example-small" type="button">Four students</button>
        <button id="example-busy" type="button">Five students, one popular project</button>
        <button id="allocate" type="button">Allocate</button>
    </div>

    <h2>Staff</h2>
    <table id="staff">
        <thead><tr><th>Id</th><th>Limit</th><th>Subjects</th></tr></thead>
        <tbody></tbody>
    </table>
    <button id="add-staff" type="button">Add staff</button>

    <h2>Projects</h2>
    <table id="projects">
        <thead><tr><th>Id</th><th>Proposer</th><th>Places</th><th>Subject</th><th>Title</th></tr></thead>
        <tbody></tbody>
    </table>
    <button id="add-project" type="button">Add project</button>

    <h2>Students</h2>
    <table id="students">
        <thead><tr><th>Id</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr></thead>
        <tbody></tbody>
    </table>
    <button id="add-student" type="button">Add student</button>

    <h2>Allocation</h2>
    <p id="score" class="score"></p>
    <table id="result">
        <thead><tr><th>Student</th><th>Project</th><th>Supervisor</th><th>Points</th></tr></thead>
        <tbody></tbody>
    </table>
</main>
<script src="allocate.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
